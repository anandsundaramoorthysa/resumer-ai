# The checks that were only ever run by hand.
#
# Everything below already existed as an npm script; nothing ran it unless someone
# remembered to. This week's production faults were all caught by hand, some of them long
# after they shipped, and the two things that would have caught the last one — the test
# suite and the PDF harness — take under two minutes between them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run the gate on demand from any branch (Actions -> CI -> Run workflow).
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scanning over the full history. The official action, pinned to a release (bump with
  # Dependabot's github-actions updates; pin to a commit SHA if you want it immutable).
  # Free for personal accounts; an organisation needs a GITLEAKS_LICENSE secret.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # No real credentials are available here, and none are needed: the suite is offline
      # and the build reads these only to decide what to configure. They are deliberately
      # unreachable values rather than secrets — a build that quietly talked to the real
      # database from CI would be a worse problem than no CI at all.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-only-placeholder-value-not-a-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` and not `npm install`: the lockfile is the point of running this at all,
      # and the project pins an esbuild override that a loose install would resolve away.
      - run: npm ci

      # Production dependencies only. A CRITICAL advisory blocks the build; HIGH is reported
      # without failing, because a high advisory with no fix available would otherwise stop
      # every merge. Triage the report weekly (Dependabot also opens the fix PRs).
      - name: "Dependency audit (blocking: critical)"
        run: npm audit --omit=dev --audit-level=critical
      - name: "Dependency audit (report: high)"
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      # Tests and scripts too (npm run typecheck runs both projects). CI checked only the
      # app, and the second project had drifted to 22 errors — in the fixtures the suites
      # assert against, which is where a wrong type quietly means a test of nothing.
      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Includes the db-* suites: the real-SQL scenarios, rateLimit, approval, dismissals,
      # sync review, enrichment and the HTTP routes run against an in-memory Postgres
      # (PGlite, a devDependency). Nothing here needs DATABASE_URL, a secret or the network;
      # the db-* helper deletes DATABASE_URL / SMTP_* / SERPAPI_API_KEY and refuses fetch().
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # The regression that passed every local test while being completely broken in
      # production: a developer machine has the native canvas binary and Netlify's Lambda
      # does not. This harness removes it deliberately. It needs no database and no
      # network — see scripts/verify-pdf-without-canvas.mts.
      - name: PDF reading without the native canvas
        run: npx tsx --tsconfig scripts/tsconfig.json scripts/verify-pdf-without-canvas.mts

      # Deliberately not run here: scripts/verify-provider-cooldown.mts, verify-auth.mts
      # and the other verify-* harnesses all need a real database. They are the checks to
      # reach for when changing those areas, and wiring them into CI needs a throwaway
      # Postgres, which is a bigger decision than this file should make on its own.

  # The suite again under V8 coverage, failing if lib/ falls below the floors in
  # scripts/ci-coverage.mjs (measured, then set 3 points lower). A separate job, so it runs
  # beside `check` rather than after it and adds no wall-clock time. It is not c8: tsx loads
  # the app through data: URLs, which c8 cannot map (the script explains).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-only-placeholder-value-not-a-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests under coverage, with floors
        run: npm run test:coverage
